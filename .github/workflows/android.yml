name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstreamer-plugins-base1.0-dev libpango1.0-dev libgl1-mesa-dev openjdk-17-jdk-headless unzip pkg-config autoconf libtool libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev python3-setuptools build-essential libstdc++6 aidl

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 setuptools

    - name: Setup Non-Root User and Build APK
      run: |
        # ১. 'builder' নামে একটি নতুন সাধারণ ইউজার তৈরি করা
        sudo useradd -m builder
        
        # ২. প্রজেক্ট ফোল্ডারের মালিকানা নতুন ইউজারকে দেওয়া
        sudo chown -R builder:builder $GITHUB_WORKSPACE
        
        # ৩. নতুন ইউজারের প্রোফাইলে অ্যান্ড্রয়েড লাইসেন্স প্রি-অ্যাকসেপ্ট করা
        sudo -u builder mkdir -p /home/builder/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161ad5c7865a31ceed987d72d11d0441d\n24333f8a63b6825ea5c551f4a835c794fe9d1522\n84831b9409646a918e30573bab4c9c91346d8abd" | sudo -u builder tee /home/builder/.buildozer/android/platform/android-sdk/licenses/android-sdk-license > /dev/null
        
        # ৪. রুট ছাড়া সাধারণ ইউজার হিসেবে বিল্ডোজার রান করা (এতে কোনো [y/n] প্রম্পট আসবে না)
        sudo -u builder buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
