name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build APK with Buildozer Action
      # ভাঙা প্যাকেজের এরর সম্পূর্ণ এড়াতে এই নির্দিষ্ট অ্যাকশন রানার ব্যবহার করা হয়েছে
      uses: Actionbravo/buildozer-action@v1.2
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
