name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # ভাঙা প্যাকেজের ঝামেলা এড়াতে অফিসিয়াল Kivy ডকার কন্টেইনার ব্যবহার
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Workspace Ownership
      run: |
        git config --global --add safe.directory /__w/qr-attendance-project/qr-attendance-project
        git config --global --add safe.directory '*'

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161ad5c7865a31ceed987d72d11d0441d\n24333f8a63b6825ea5c551f4a835c794fe9d1522\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build Android APK with Buildozer
      run: |
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
