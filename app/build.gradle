plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jibonder.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.jibonder.attendance"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
